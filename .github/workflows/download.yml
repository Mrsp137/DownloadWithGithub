name: '📦 حرفه‌ای: دانلود و ذخیره در مخزن'

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: '🔗 لینک مستقیم فایل'
        required: true
        type: string
      password:
        description: '🔐 رمز فایل فشرده (اختیاری)'
        required: false
        type: string
        default: ''
      split_size:
        description: '📦 حجم هر تکه (پیش‌فرض: 95m) مثال: 95m, 100m, 200m'
        required: false
        type: string
        default: '95m'

permissions:
  contents: write

# جلوگیری از تداخل شمارنده
concurrency:
  group: "download-serial"
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 دریافت کد مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ نصب ابزارها
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full file

      - name: 📥 دانلود فایل
        id: download
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.file_url }}"
          echo "در حال دانلود از: $URL"
          curl -L --fail --retry 5 --retry-delay 5 --progress-bar -o downloaded_file "$URL"
          ls -lh downloaded_file

      - name: 🧠 تشخیص نوع و استخراج نام اصلی
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          RAW_NAME=$(basename "${{ github.event.inputs.file_url }}" | sed 's/\?.*//' | sed 's/%20/ /g')
          if [ -z "$RAW_NAME" ]; then RAW_NAME="unknown_file"; fi
          
          BASENAME_NOEXT="${RAW_NAME%.*}"
          if [ "$BASENAME_NOEXT" = "$RAW_NAME" ]; then
            BASENAME_NOEXT="$RAW_NAME"
          fi

          FOLDER_NAME=$(echo "$BASENAME_NOEXT" | sed 's/[\\/:*?"<>|]/_/g')
          if [ -z "$FOLDER_NAME" ]; then FOLDER_NAME="downloaded_file"; fi
          
          ORIGINAL_FILENAME=$(echo "$RAW_NAME" | sed 's/[\\/:*?"<>|]/_/g')
          
          MIME=$(file -b --mime-type downloaded_file)
          EXT="${RAW_NAME##*.}"
          EXT=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
          
          if [[ "$MIME" == video/* ]] || [[ "$EXT" =~ ^(mp4|mkv|avi|mov|wmv|flv|webm)$ ]]; then
            CAT="video"
          elif [[ "$MIME" == audio/* ]] || [[ "$EXT" =~ ^(mp3|wav|ogg|flac|m4a)$ ]]; then
            CAT="audio"
          elif [[ "$MIME" == image/* ]] || [[ "$EXT" =~ ^(jpg|jpeg|png|gif|bmp|webp)$ ]]; then
            CAT="image"
          elif [[ "$MIME" == application/pdf ]] || [[ "$EXT" =~ ^(pdf|doc|docx|xls|xlsx|ppt|pptx|txt)$ ]]; then
            CAT="document"
          else
            CAT="other"
          fi
          
          echo "CAT=$CAT" >> $GITHUB_ENV
          echo "FOLDER_NAME=$FOLDER_NAME" >> $GITHUB_ENV
          echo "ORIGINAL_FILENAME=$ORIGINAL_FILENAME" >> $GITHUB_ENV
          echo "✅ دسته: $CAT → زیرپوشه: $FOLDER_NAME"
          echo "📄 نام اصلی فایل: $ORIGINAL_FILENAME"

      - name: 🔄 تغییر نام فایل به نام اصلی
        shell: bash
        run: |
          set -euo pipefail
          mv downloaded_file "${{ env.ORIGINAL_FILENAME }}"
          echo "فایل به نام ${{ env.ORIGINAL_FILENAME }} تغییر نام یافت"
          ls -lh "${{ env.ORIGINAL_FILENAME }}"

      - name: 🗜️ فشرده‌سازی ZIP و افزایش شمارنده
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          # lock ساده برای جلوگیری از race روی counter
          LOCKFILE=".counter.lock"
          exec 9>"$LOCKFILE"
          flock 9

          # اطمینان از وجود شمارنده
          if [ ! -f counter.txt ] || ! [[ "$(cat counter.txt)" =~ ^[0-9]+$ ]]; then
            echo "0" > counter.txt
          fi

          i=$(cat counter.txt)
          i=$((i+1))
          echo "$i" > counter.txt

          FINAL_DIR="downloads/${{ env.CAT }}/${{ env.FOLDER_NAME }}"
          mkdir -p "$FINAL_DIR"

          BASE_NAME="telegram-${i}.zip"
          OUT_PATH="$FINAL_DIR/$BASE_NAME"

          # پاک‌سازی قبلی
          rm -f "${OUT_PATH}" "${OUT_PATH}".* || true

          if [ -n "${{ github.event.inputs.password }}" ]; then
            7z a -tzip -p"${{ github.event.inputs.password }}" -mem=AES256 -mx=3 \
              -v${{ github.event.inputs.split_size }} "$OUT_PATH" "./${{ env.ORIGINAL_FILENAME }}"
          else
            7z a -tzip -mx=3 \
              -v${{ github.event.inputs.split_size }} "$OUT_PATH" "./${{ env.ORIGINAL_FILENAME }}"
          fi

          # اطمینان از خروجی واقعی
          shopt -s nullglob
          parts=( "${OUT_PATH}" "${OUT_PATH}".* )
          shopt -u nullglob

          if [ ${#parts[@]} -eq 0 ]; then
            echo "❌ هیچ خروجی‌ای ساخته نشد."
            exit 1
          fi

      - name: 📝 کامیت و پوش به مخزن
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add counter.txt
          git add "${{ env.OUT_PATH }}"* || true

          git commit -m "Add ${{ env.BASE_NAME }} (category: ${{ env.CAT }}, id: ${{ env.COUNTER }})" || echo "Nothing to commit"
          git push




      - name: 🕒 حذف خودکار بعد از ۱ ساعت
        shell: bash
        run: |
          set -euo pipefail
          sleep 30

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # جلوگیری از conflict
          git pull --rebase

          # حذف همه پارت‌ها
          git rm -f "${{ env.OUT_PATH }}"* || true

          git commit -m "Remove ${{ env.BASE_NAME }} (id: ${{ env.COUNTER }})" || echo "Nothing to commit"
          git push
