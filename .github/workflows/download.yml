name: Download and Split for User

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'لینک مستقیم فایل'
        required: true
        type: string
      zip_password:
        description: 'رمز عبور ZIP'
        required: true
        type: string
      user_id:
        description: 'شناسه کاربر'
        required: true
        type: string

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Notify job started (Telegram)
        run: |
          MSG="✅ Job started برای user: ${{ github.event.inputs.user_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
          MSG1="فرایند دانلود درحال شروع ..."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${{ github.event.inputs.user_id }}" \
            --data-urlencode "text=${MSG1}"

      - name: Optimized Checkout (fast)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install 7z
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download file with resume support (using wget)
        run: |
          ORIGINAL_NAME=$(basename "${{ github.event.inputs.file_url }}" | cut -d '?' -f1)
          if [ -z "$ORIGINAL_NAME" ]; then
            ORIGINAL_NAME="downloaded_file"
          fi
          echo "ORIGINAL_NAME=$ORIGINAL_NAME" >> $GITHUB_ENV
          
          echo "Starting download of: $ORIGINAL_NAME"
          wget -c -t 20 -T 60 --retry-connrefused --waitretry=5 -O "$ORIGINAL_NAME" "${{ github.event.inputs.file_url }}"
          
          # Verify file is not empty
          if [ ! -s "$ORIGINAL_NAME" ]; then
            echo "❌ Downloaded file is empty or missing!"
            exit 1
          fi
      
          # ✅ Check file size limit (600MB = 629145600 bytes)
          FILE_SIZE=$(stat -c%s "$ORIGINAL_NAME")
          MAX_SIZE=$((600 * 1024 * 1024))
      
          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            MSG="❌ فایل شما بیش از ۶۰۰ مگابایت است و قابل پردازش نیست."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${{ github.event.inputs.user_id }}" \
              --data-urlencode "text=${MSG}"
            rm -f "$ORIGINAL_NAME"
            exit 1
          fi
      
          echo "✅ Download completed successfully"

      - name: Create archive chunks (95MB each)
        run: |
          7z a -p"${{ github.event.inputs.zip_password }}" -mhe=on -mx=3 -v95m "archive.7z" "${{ env.ORIGINAL_NAME }}"

      - name: Clean up original file
        run: rm -f "${{ env.ORIGINAL_NAME }}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get total chunks count
        id: chunks
        run: |
          CHUNKS=$(ls archive.7z.* 2>/dev/null | wc -l)
          echo "total_chunks=$CHUNKS" >> $GITHUB_OUTPUT

      - name: Notify total chunks (Telegram)
        run: |
          MSG="📦 Total chunks: ${{ steps.chunks.outputs.total_chunks }} | user: ${{ github.event.inputs.user_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
            
          MSG1="تعداد کل پارت ها : ${{ steps.chunks.outputs.total_chunks }} 📦"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${{ github.event.inputs.user_id }}" \
            --data-urlencode "text=${MSG1}"
            
      - name: Create user branch and push chunks
        run: |
          BRANCH_NAME="user_${{ github.event.inputs.user_id }}_$(date +%s)"
          git checkout --orphan "$BRANCH_NAME"
          git rm -rf . 2>/dev/null || true
          echo "# Files for user ${{ github.event.inputs.user_id }}" > README.md

          chunks=(archive.7z.*)
          total=${#chunks[@]}
          batch_size=2
          start=0
          uploaded=0

          while [ $start -lt $total ]; do
            end=$((start + batch_size - 1))
            [ $end -ge $total ] && end=$((total - 1))

            for i in $(seq $start $end); do
              git add "${chunks[$i]}"
            done
            git add README.md
            git commit -m "Add chunks $((start+1))-$((end+1)) of $total"

            pushed=false
            for attempt in {1..5}; do
              if git push origin "$BRANCH_NAME"; then
                echo "Push successful for chunks $((start+1))-$((end+1))"
                uploaded=$((end+1))
                pushed=true
                break
              else
                echo "Push failed (attempt $attempt), retrying in 10 seconds..."
                sleep 10
              fi
            done

            if [ "$pushed" = false ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi

            MSG="⏫ Uploaded chunks: ${uploaded}/${total} | user: ${{ github.event.inputs.user_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}"

            start=$((end + 1))
            sleep 2
          done

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Notify job done (Telegram)
        run: |
          MSG="🎉 Job done | user: ${{ github.event.inputs.user_id }} | branch: ${{ env.BRANCH_NAME }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
      - name: Send telegram
        run: |
          DOWN="https://github.com/Mrsp137/DownloadWithGithub/archive/refs/heads/${{ env.BRANCH_NAME }}.zip"
          MSG="${DOWN}
          
          لینک دانلود شما بعد از 2 ساعت منقضی خواهد شد👽.
         
          📢 My Channel: @FreeV2rng"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${{ github.event.inputs.user_id }}" \
          --data-urlencode "text=${MSG}"
          
      - name: Notify on failure (Telegram)
        if: ${{ failure() }}
        run: |
          MSG="❌ Workflow failed | user: ${{ github.event.inputs.user_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"

          MSG1="❌ بسته شما دانلود نشد. جهت بررسی به ادمین پیام بفرستید : @ad_v2rr"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${{ github.event.inputs.user_id }}" \
          --data-urlencode "text=${MSG1}"
